name: Preview Pages

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: taiki-e/install-action@v2
        with:
          tool: jj-cli
      - run: npm ci
      - run: node scripts/preview.mjs "$RUNNER_TEMP/preview"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/preview

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check current main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_SHA: ${{ github.sha }}
        run: |
          current=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$RUN_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping stale preview deployment.'
          fi
      - name: Deploy preview
        if: steps.main.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
