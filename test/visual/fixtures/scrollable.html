<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Reachable scrolling content</title><style>body{font:18px system-ui;background:#fff;color:#111}#outer{height:130px;overflow:hidden}#pane{height:100px;overflow:auto}#ellipsis{width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}</style></head><body><main><h1>Reachable scrolling content</h1><div id="outer"><div id="pane"><p>At the top</p><button style="margin-top:200px">Reachable below the pane</button><p>End of scrollable content</p></div></div><p id="ellipsis">Text with an intentional ellipsis</p><div id="shadow"></div></main><script>document.querySelector('#shadow').attachShadow({mode:'open'}).innerHTML='<button>Shadow button</button>';</script></body></html>
